name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-config, phpize

      - name: Install Clang and dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev php-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Build release extension
        run: cargo build --release

      - name: Run PHP test suite
        run: cd php && php -d extension=../target/release/libstephp_cap_std.so test.php
