[package]
name = "stephp-cap-std"
version = "0.6.0"
edition = "2024"
keywords = ["php", "ext-php-rs", "cap-std", "sandbox", "security"]
categories = ["api-bindings", "filesystem"]

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "0.15.12"
cap-std = "4.0.2"
fs-set-times = "0.20.3"
rustix = { version = "0.38", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "debuginfo"
